services:
  php:
    build: .
    container_name: php-darts
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.php.rule=Host(`darts.skruellex.com`)"
      - "traefik.http.routers.php.entrypoints=websecure"
      - "traefik.http.routers.php.tls=true"
      - "traefik.http.routers.php.tls.certresolver=letsencrypt"
    networks:
      - traefik_proxy
    environment:
      - APP_ENV=prod
    restart: always

networks:
  traefik_proxy:
    external: true